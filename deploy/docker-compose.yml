# Reference for /data/apps/todo/docker-compose.yml on the server (standard 005, 5.5). The deploy only
# rewrites .tag; this file is kept by the administrator.
services:
  todo:
    image: moli-todo:${APP_TAG}
    container_name: todo
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Singapore
    volumes:
      - ./data:/app/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=server-internal-net
      - traefik.http.routers.todo.rule=Host(`todo.xiangyu.pro`)
      - traefik.http.routers.todo.entrypoints=websecure
      - traefik.http.services.todo.loadbalancer.server.port=3000
    networks:
      - server-internal-net

networks:
  server-internal-net:
    external: true
