name: release

# Publishes the desktop app (standard 006, 6.5): push a tag vX.Y.Z on the commit that is the head of main
# and that `ci` has passed, after `chore(release): vX.Y.Z` bumped `version` in package.json.
#
#   prepare  checks the tag, the signing secrets and the update key, drafts the release with its notes
#   build    Windows x64 (NSIS installer) and macOS arm64 (.app archive and .dmg), signed
#   release  checks everything the builds made, adds latest.json (the update feed) and SHA256SUMS to the
#            draft, makes sure main has not moved, publishes, then reads the published feed the way an
#            installed app will and puts the release back to draft if that does not check out
#
# "Run workflow" by hand is a dry run: the same builds, signed with a throwaway key and checked the same
# way, but nothing is published; the files are kept as the run's artifacts for a week.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancelled halfway (that leaves a draft behind).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
      checks: read # whether ci passed on this commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry: ${{ steps.version.outputs.dry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # setup-node caches npm by itself when package.json has packageManager

      - name: Work out the version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then dry=false; else dry=true; fi
          echo "dry=$dry" >> "$GITHUB_OUTPUT"

      - name: Check the tag
        if: steps.version.outputs.dry == 'false'
        run: node scripts/release/cli.ts check-tag "$GITHUB_REF_NAME"

      - name: Check this is the head of main and that ci passed on it
        if: steps.version.outputs.dry == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME is not the head of main; tag the latest commit of main instead"
            exit 1
          fi
          result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "ci-gate")] | map(.conclusion) | first // "none"')
          if [ "$result" != success ]; then
            echo "::error::ci-gate is '$result' on this commit; wait for ci to pass, then tag again"
            exit 1
          fi

      # Without the keys nothing can be signed, and a release the installed apps cannot verify must not go
      # out (standard 007, 7.6.2).
      - name: Check the signing keys
        if: steps.version.outputs.dry == 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          ok=true
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD CODESIGN_P12_BASE64 CODESIGN_P12_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::the secret $name is not set (standard 012, 12.5.2; scripts/setup-updater-keys.sh makes the update key)"
              ok=false
            fi
          done
          if [ -z "$(node -p 'require("./desktop/src-tauri/tauri.conf.json").plugins?.updater?.pubkey ?? ""')" ]; then
            echo "::error::desktop/src-tauri/tauri.conf.json has no plugins.updater.pubkey; run scripts/setup-updater-keys.sh and commit the result"
            ok=false
          fi
          $ok

      - name: Make a throwaway update key for the dry run
        if: steps.version.outputs.dry == 'true'
        run: |
          npm ci
          mkdir dry-key
          npx tauri signer generate --ci -w dry-key/updater.key -p dry > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.dry == 'true'
        with:
          name: dry-key
          path: dry-key/
          retention-days: 1

      - name: Write the release notes
        run: |
          tag="v${{ steps.version.outputs.version }}"
          node scripts/release/cli.ts notes "$tag" "$GITHUB_SHA" > notes.md
          cat notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes.md
          retention-days: 7

      # Drafted first, filled in by `release`, public only when it is complete (standard 006, 6.5.3).
      - name: Draft the release
        if: steps.version.outputs.dry == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Moli Todo ${{ steps.version.outputs.version }}" \
            --notes-file notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: macos
            os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # setup-node caches npm by itself when package.json has packageManager
      - name: Install the Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.prepare.outputs.dry == 'true'
        with:
          name: dry-key
          path: dry-key

      # The update archive is made when this is set; the dry run points it at the throwaway key's public half.
      - name: Choose the update key
        shell: bash
        env:
          DRY: ${{ needs.prepare.outputs.dry }}
        run: |
          if [ "$DRY" = true ]; then
            pub=$(tr -d '\n' < dry-key/updater.key.pub)
            config=$(PUB="$pub" node -p 'JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.PUB,endpoints:["https://example.invalid/latest.json"]}}})')
          else
            config='{"bundle":{"createUpdaterArtifacts":true}}'
          fi
          echo "RELEASE_TAURI_CONFIG=$config" >> "$GITHUB_ENV"

      # A throwaway keychain with the shared self-signed certificate (standard 007, 7.5.1); the runner is
      # discarded afterwards, and the keychain is deleted below anyway.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CODESIGN_P12_BASE64" ] || [ -z "$CODESIGN_P12_PASSWORD" ]; then
            echo "::error::CODESIGN_P12_BASE64 / CODESIGN_P12_PASSWORD are not available; no signed macOS build"
            exit 1
          fi
          keychain="$RUNNER_TEMP/codesign.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/codesign.p12"
          printf '%s' "$CODESIGN_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CODESIGN_P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$certificate"
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          security find-identity -p codesigning "$keychain"
          identity="$(security find-identity -p codesigning "$keychain" | grep -Eo '[0-9A-F]{40}' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::no signing identity in the certificate"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and sign
        shell: bash
        env:
          DRY: ${{ needs.prepare.outputs.dry }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.dry == 'true' && format('{0}/dry-key/updater.key', github.workspace) || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.prepare.outputs.dry == 'true' && 'dry' || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci --bundles ${{ matrix.bundles }} --config "$RELEASE_TAURI_CONFIG"

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/codesign.keychain-db" 2> /dev/null || true

      # Name the files by standard 006, 6.6.1, and refuse a package whose version is not the tag's (6.5.2).
      - name: Collect the files
        shell: bash
        run: |
          set -euo pipefail
          bundle=desktop/target/release/bundle
          mkdir out
          take() { # take <pattern> <new name>
            local found
            found=$(find "$bundle" -name "$1" -not -path '*/macos/*/*' | head -2)
            if [ "$(echo "$found" | grep -c .)" != 1 ]; then
              echo "::error::expected exactly one $1 under $bundle, found: ${found:-none}"
              exit 1
            fi
            cp "$found" "out/$2"
          }
          if [ "$RUNNER_OS" = Windows ]; then
            take "*_${VERSION}_x64-setup.exe" "MoliTodo_${VERSION}_windows_x64.exe"
            take "*_${VERSION}_x64-setup.exe.sig" "MoliTodo_${VERSION}_windows_x64.exe.sig"
          else
            take "*_${VERSION}_aarch64.dmg" "MoliTodo_${VERSION}_macos_arm64.dmg"
            take "*.app.tar.gz" "MoliTodo_${VERSION}_macos_arm64.app.tar.gz"
            take "*.app.tar.gz.sig" "MoliTodo_${VERSION}_macos_arm64.app.tar.gz.sig"
            app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -1)
            codesign --verify --deep --strict --verbose=2 "$app"
            details=$(codesign -dv "$app" 2>&1)
            echo "$details" | grep -E 'Identifier|Authority|Signature|TeamIdentifier' || true
            # An ad-hoc signature means the certificate was not used, and macOS would ask for permissions again.
            if echo "$details" | grep -q 'Signature=adhoc'; then
              echo "::error::the app has an ad-hoc signature, not the shared certificate's"
              exit 1
            fi
          fi
          ls -l out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.name }}
          path: out/
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # upload to the draft, publish it
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DRY: ${{ needs.prepare.outputs.dry }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # setup-node caches npm by itself when package.json has packageManager
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.DRY == 'true'
        with:
          name: dry-key
          path: dry-key

      - name: The public key the app carries
        id: key
        run: |
          if [ "$DRY" = true ]; then
            echo "pubkey=$(tr -d '\n' < dry-key/updater.key.pub)" >> "$GITHUB_OUTPUT"
          else
            echo "pubkey=$(node -p 'require("./desktop/src-tauri/tauri.conf.json").plugins.updater.pubkey')" >> "$GITHUB_OUTPUT"
          fi

      # Every file the builds made, its signature checked with that public key, then latest.json and
      # SHA256SUMS written (standard 006, 6.5.2 and 6.5.6).
      - name: Check the builds and write the feed
        run: node scripts/release/cli.ts assemble out "$VERSION" "$GITHUB_REPOSITORY" notes.md "${{ steps.key.outputs.pubkey }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.DRY == 'true'
        with:
          name: release-preview
          path: |
            out/MoliTodo_*
            out/latest.json
            out/SHA256SUMS
          retention-days: 7

      - name: Add the files to the draft
        if: env.DRY == 'false'
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            out/MoliTodo_"$VERSION"_windows_x64.exe \
            out/MoliTodo_"$VERSION"_macos_arm64.dmg \
            out/MoliTodo_"$VERSION"_macos_arm64.app.tar.gz \
            out/latest.json out/SHA256SUMS

      # What is public must be what was built from this tag (standard 006, 6.5.4).
      - name: Check main has not moved
        if: env.DRY == 'false'
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main moved on to $head while this was building; the draft $GITHUB_REF_NAME is left unpublished, release again from the new head"
            exit 1
          fi

      - name: Publish
        id: publish
        if: env.DRY == 'false'
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      # What the installed apps will read (standard 006, 6.5.5; 007, 7.3.3).
      - name: Check the published feed
        if: env.DRY == 'false'
        run: node scripts/release/cli.ts verify-published "$GITHUB_REPOSITORY" "$VERSION" "${{ steps.key.outputs.pubkey }}"

      # Stop the loss first (standard 006, 6.8.1): back to a draft, so the feed and the download page no
      # longer offer it. Fix, then release a new patch version.
      - name: Take it back if the feed is wrong
        if: failure() && steps.publish.outcome == 'success'
        run: gh release edit "$GITHUB_REF_NAME" --draft=true
