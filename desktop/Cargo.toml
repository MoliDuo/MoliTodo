[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
# Not the app version: that is `version` in /package.json (the one source, standard 006, 6.2.2), which
# tauri.conf.json points at. These crates are never published.
version = "0.0.0"
edition = "2021"
license = "LicenseRef-Proprietary"
repository = "https://github.com/MoliDuo/MoliTodo"
